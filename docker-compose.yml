services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/nrg.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    volumes:
      - nrg-data:/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

volumes:
  nrg-data:
